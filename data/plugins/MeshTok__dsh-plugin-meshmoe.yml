  en: Run a free local MeshMoe-4B agent in DeepSeek Harness — one-click llama.cpp runtime, zero registration, zero API keys. Your machine joins the MeshMoe distributed compute network as a specialist node and earns Joules (honor credits) for mesh tasks it serves.
